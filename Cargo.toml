[package]
name = "loopgen"
version = "0.2.0"
edition = "2021"
description = "Agentic loop runner for Claude Code — drives `claude -p` in an iterative loop with a LOOP_STATUS termination contract. Supports interactive wizard, TOML configs, and bash export."
license = "MIT"
repository = "https://github.com/adventurewave-labs/loopgen-rs"
keywords = ["claude", "cli", "agent", "automation", "loop"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "loopgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"

[profile.release]
strip = true
